<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEADWICK</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DEADWICK">
<meta name="theme-color" content="#0D1016">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Bricolage+Grotesque:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1016; --panel:#161A23; --panel2:#11151D; --line:#262C3A; --line2:#353C4E;
    --bull:#5CF03D; --bear:#F2385A; --gold:#FFB21E; --ice:#A44DFF; --teal:#12B886;
    --text:#ECEEF3; --muted:#9AA1B2; --dim:#6B7285;
    --display:'Unbounded','Bricolage Grotesque',system-ui,sans-serif;
    --body:'Bricolage Grotesque',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;padding-bottom:130px;overflow-x:hidden}
  body{background-image:radial-gradient(900px 500px at 12% -8%, rgba(92,240,61,.07), transparent 60%),radial-gradient(800px 520px at 92% 0%, rgba(164,77,255,.08), transparent 60%),radial-gradient(1000px 700px at 50% 120%, rgba(164,77,255,.06), transparent 55%);background-attachment:fixed}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
    background-image:linear-gradient(rgba(140,150,175,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(140,150,175,.06) 1px,transparent 1px);
    background-size:46px 46px;mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 85%);-webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 85%)}
  .wrap{position:relative;z-index:2;max-width:640px;margin:0 auto;padding:18px 16px 0}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .logo{display:flex;align-items:center;gap:12px}
  .logo .cat{width:46px;height:46px;flex:0 0 auto;border-radius:12px;background:var(--panel);border:1px solid var(--line2);padding:5px;
    box-shadow:0 0 18px rgba(92,240,61,.22),inset 0 0 18px rgba(92,240,61,.12)}
  .brand{font-family:var(--display);font-weight:800;line-height:1}
  .brand .l1{font-size:22px;letter-spacing:.02em;display:flex;align-items:center}
  .brand small{display:flex;align-items:center;font-size:9.5px;letter-spacing:.22em;color:var(--muted);margin-top:5px;font-weight:800}
  .cdl{display:inline-block;position:relative;width:.42em;height:.62em;margin:0 .06em;background:currentColor;border-radius:1px}
  .cdl::before{content:"";position:absolute;left:50%;top:-.33em;bottom:-.33em;width:2px;margin-left:-1px;background:inherit}
  .cdl.g{color:var(--bull)} .cdl.p{color:var(--ice)}
  .tape{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right;line-height:1.7;letter-spacing:.04em}
  .tape b{color:var(--bull);font-weight:600}
  .tape .dn{color:var(--bear)}

  .tabs{display:flex;gap:5px;margin:0 0 14px;border:1px solid var(--line);border-radius:12px;padding:4px;background:rgba(15,19,26,.8)}
  .tab{flex:1;padding:9px 2px;border-radius:9px;border:none;background:transparent;color:var(--muted);
    font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.12em;cursor:pointer}
  .tab.on{color:#0D1016;background:var(--bull)}

  .rail{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;
    cursor:pointer;transition:.18s;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--muted);text-align:left}
  .chip .f{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;margin-top:3px;opacity:.75;font-weight:400}
  .chip.on{color:var(--text);border-color:var(--bull);background:rgba(92,240,61,.10);box-shadow:inset 0 0 0 1px rgba(92,240,61,.3)}
  .chip.rest{border-style:dashed}

  .title{font-family:var(--display);font-size:24px;letter-spacing:.03em;font-weight:800;margin:2px 0 1px;text-transform:uppercase}
  .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
  .sub.h{margin-top:22px}
  .card{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;background:var(--panel)}
  .card.done{border-color:rgba(18,184,134,.55)}
  .chead{display:flex;align-items:center;gap:11px;padding:10px 12px;cursor:pointer}
  .glyph{flex:0 0 auto;width:46px;height:54px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;overflow:hidden}
  .cname{flex:1;min-width:0}
  .cname h3{margin:0;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
  .cname p{margin:3px 0 0;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.03em;line-height:1.5}
  .cname p b{color:var(--text);font-weight:600}
  .cname p .beat{color:var(--gold);font-weight:600}
  .cname p .beaten{color:var(--teal);font-weight:600}
  .pill{font-family:var(--mono);font-size:10px;font-weight:600;padding:5px 8px;border-radius:7px;border:1px solid var(--line);color:var(--muted);flex:0 0 auto}
  .card.done .pill{color:var(--teal);border-color:rgba(18,184,134,.4)}

  .sets{display:none;padding:2px 12px 12px;border-top:1px solid var(--line)}
  .card.open .sets{display:block}
  .row{display:flex;align-items:center;gap:8px;padding:7px 0}
  .snum{font-family:var(--mono);font-size:9px;color:var(--muted);width:24px;letter-spacing:.08em}
  .fld{flex:1;position:relative}
  .fld input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--text);
    font-family:var(--mono);font-size:15px;font-weight:600;padding:10px 32px 10px 11px;outline:none;transition:.15s}
  .fld input:focus{border-color:var(--bull)}
  .fld span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:9px;color:var(--muted);pointer-events:none}
  .tick{flex:0 0 auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
    color:var(--muted);cursor:pointer;font-size:16px;display:grid;place-items:center;transition:.18s}
  .tick.on{background:var(--teal);border-color:transparent;color:#0D1016}
  .tick.pr{background:var(--gold);color:#2A1B00}
  .note{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.04em;padding:6px 0 8px;line-height:1.6}
  .note em{color:var(--gold);font-style:normal}

  /* counter cards (reps accumulate) */
  .cnt{display:flex;align-items:center;gap:10px;padding:10px 12px}
  .cnt .big{font-family:var(--mono);font-size:22px;font-weight:800;min-width:92px;text-align:right}
  .cnt .big small{font-size:10px;color:var(--muted);font-weight:400}
  .cnt .bar{flex:1;height:6px;border-radius:99px;background:rgba(140,150,175,.12);overflow:hidden}
  .cnt .bar i{display:block;height:100%;width:0;background:var(--bull);transition:width .3s}
  .cbtns{display:flex;gap:6px;padding:0 12px 12px}
  .cbtns button{flex:1;padding:10px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);
    font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer}
  .cbtns button:active{background:rgba(92,240,61,.2)}
  .cbtns button.neg{color:var(--bear)}

  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(13,16,22,0),rgba(13,16,22,.95) 30%);backdrop-filter:blur(14px)}
  .dock.off{display:none}
  .dockin{max-width:640px;margin:0 auto}
  .tube{height:10px;border-radius:99px;border:1px solid var(--line);background:rgba(140,150,175,.06);overflow:hidden;position:relative}
  .charge{height:100%;width:0;border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.2,1);background:linear-gradient(90deg,var(--bull),var(--gold))}
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:10px}
  .meta div{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
  .meta b{color:var(--text);font-weight:800;font-size:13px}
  .meta b.g{color:var(--gold)}
  .btn{border:none;border-radius:10px;padding:11px 16px;cursor:pointer;font-family:var(--display);font-weight:800;font-size:15px;
    letter-spacing:.1em;color:#0D1016;background:var(--bull)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}
  .btn.red{background:var(--bear);color:#fff}

  .rest{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(20px);z-index:25;display:none;align-items:center;gap:10px;
    padding:9px 12px;border-radius:99px;border:1px solid rgba(92,240,61,.4);background:rgba(17,21,29,.96);backdrop-filter:blur(10px);
    font-family:var(--mono);font-size:12px;font-weight:600;color:var(--bull);opacity:0;transition:.25s}
  .rest.on{display:flex;opacity:1;transform:translateX(-50%) translateY(0)}
  .rest button{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:0 2px}

  .hrow{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border:1px solid var(--line);border-radius:11px;
    margin-bottom:8px;background:var(--panel);gap:10px}
  .hrow .l{font-family:var(--display);font-size:17px;font-weight:700;text-transform:uppercase;min-width:0}
  .hrow .l small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px;letter-spacing:.06em;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow .r{font-family:var(--mono);font-size:14px;font-weight:800;color:var(--bull);flex:0 0 auto;text-align:right}
  .hrow .r small{display:block;font-size:9px;color:var(--muted);font-weight:400;margin-top:2px}
  .hrow .r.gold{color:var(--gold)}
  .empty{border:1px dashed var(--line2);border-radius:12px;padding:24px 18px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);line-height:1.9}
  .flash{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:99px;font-family:var(--mono);
    font-size:11px;font-weight:600;color:#0D1016;background:var(--bull);opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
  .flash.gold{background:var(--gold);color:#2A1B00}
  .flash.on{opacity:1}

  /* info blocks */
  .info{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:14px;margin-bottom:10px}
  .info h4{margin:0 0 6px;font-family:var(--display);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
  .info p{margin:0;font-size:13px;line-height:1.55;color:#C5CEDB}
  .info ul{margin:8px 0 0;padding-left:18px;font-size:13px;line-height:1.6;color:#C5CEDB}
  .info .k{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.14em;margin-bottom:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sel{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
  .sel button{padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer}
  .sel button.on{color:#0D1016;background:var(--bull);border-color:transparent}
  .link{display:inline-block;margin-top:10px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ice);text-decoration:none;border-bottom:1px solid rgba(164,77,255,.35);padding-bottom:2px}
  .toggle{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--panel);cursor:pointer}
  .toggle .t{flex:1;font-family:var(--display);font-size:17px;font-weight:700;text-transform:uppercase}
  .toggle .t small{display:block;font-family:var(--mono);font-size:9.5px;color:var(--muted);text-transform:none;margin-top:2px;line-height:1.5}
  .toggle .st{font-family:var(--mono);font-size:10px;font-weight:600;padding:6px 9px;border-radius:7px;border:1px solid var(--line);color:var(--muted)}
  .toggle.pass .st{color:var(--bull);border-color:rgba(92,240,61,.4)}
  .toggle.fail .st{color:var(--bear);border-color:rgba(242,56,90,.4)}
  .tbtn{font-family:var(--mono);font-size:10px;font-weight:600;padding:7px 9px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer}

  /* WOD clock */
  .clock{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:18px 14px;text-align:center;margin-bottom:10px;position:relative;overflow:hidden}
  .clock .mode{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--bull);margin-bottom:6px}
  .clock .time{font-family:var(--mono);font-size:66px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .clock .time.warn{color:var(--bear)}
  .clock .time.work{color:var(--bull)}
  .clock .time.restp{color:var(--ice)}
  .clock .lap{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.08em;min-height:16px}
  .clock .ctr{display:flex;gap:8px;justify-content:center;margin-top:16px}
  .clock .ctr .btn{flex:1;max-width:160px}
  .cfg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .cfg label{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--muted);display:block;text-align:left;margin-bottom:4px}
  .cfg input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--text);font-family:var(--mono);font-size:15px;font-weight:600;padding:9px 10px;outline:none}
  .cfg input:focus{border-color:var(--bull)}
  .laps{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:left;margin-top:10px;max-height:110px;overflow:auto;line-height:1.8}

  /* form overlay */
  .veil{position:fixed;inset:0;z-index:50;display:none;background:rgba(13,16,22,.84);backdrop-filter:blur(10px);align-items:flex-end;justify-content:center}
  .veil.on{display:flex}
  .sheet{width:100%;max-width:640px;background:var(--panel);border:1px solid var(--line2);max-height:88vh;overflow:auto;
    border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .sheet h2{font-family:var(--display);font-size:26px;margin:0 0 2px;letter-spacing:.03em;text-transform:uppercase}
  .sheet .tag{font-family:var(--mono);font-size:10px;color:var(--bull);letter-spacing:.18em;margin-bottom:12px}
  .stage{height:200px;border-radius:14px;border:1px solid var(--line);margin-bottom:14px;background:var(--panel2)}
  .cues{list-style:none;padding:0;margin:0 0 14px}
  .cues li{display:flex;gap:9px;font-size:13.5px;line-height:1.5;padding:6px 0;color:#C5CEDB}
  .cues li::before{content:"";flex:0 0 auto;width:6px;height:6px;border-radius:2px;margin-top:7px;background:var(--bull)}
  .srow{display:flex;gap:8px}
  .srow a,.srow button{flex:1;text-align:center;text-decoration:none;padding:12px;border-radius:10px;cursor:pointer;
    font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.08em;border:1px solid var(--line2);background:transparent;color:var(--muted)}
  .srow a{color:var(--text);border-color:rgba(92,240,61,.45);background:rgba(92,240,61,.08)}

  /* ================= THE RIG ================= */
  @property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
  @property --b{syntax:'<angle>';inherits:false;initial-value:0deg}
  @property --c{syntax:'<angle>';inherits:false;initial-value:0deg}
  @property --d{syntax:'<angle>';inherits:false;initial-value:0deg}
  @property --e{syntax:'<angle>';inherits:false;initial-value:0deg}
  @property --y{syntax:'<length>';inherits:false;initial-value:0px}
  .rig{width:100%;height:100%;display:block}
  .rig .bone{stroke:var(--ice);stroke-width:6;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 3px rgba(164,77,255,.7))}
  .rig .core{stroke:var(--bull);filter:drop-shadow(0 0 4px rgba(92,240,61,.8))}
  .rig .load{fill:var(--gold);filter:drop-shadow(0 0 4px rgba(255,178,30,.9))}
  .rig .bar{stroke:rgba(255,255,255,.25);stroke-width:3;stroke-linecap:round}
  .rig .body{transform:translateY(var(--y))}
  .rig .upper{transform:translate(60px,90px) rotate(var(--e)) translate(-60px,-90px)}
  .rig .arm  {transform:translate(60px,44px) rotate(var(--a)) translate(-60px,-44px)}
  .rig .fore {transform:translate(60px,68px) rotate(var(--b)) translate(-60px,-68px)}
  .rig .thigh{transform:translate(60px,92px) rotate(var(--c)) translate(-60px,-92px)}
  .rig .shin {transform:translate(60px,120px) rotate(var(--d)) translate(-60px,-120px)}
  .rig *{animation-timing-function:cubic-bezier(.45,.05,.35,1);animation-iteration-count:infinite}
  .r-press .arm{--a:104deg;animation:pA 2.4s}   @keyframes pA{0%,100%{--a:104deg}45%{--a:158deg}}
  .r-press .fore{--b:76deg;animation:pB 2.4s}   @keyframes pB{0%,100%{--b:76deg}45%{--b:22deg}}
  .r-lat .arm{--a:8deg;animation:lA 2.4s}       @keyframes lA{0%,100%{--a:8deg}50%{--a:90deg}}
  .r-lat .fore{--b:8deg}
  .r-fly .arm{--a:44deg;animation:fA 2.6s}      @keyframes fA{0%,100%{--a:44deg}50%{--a:100deg}}
  .r-fly .fore{--b:26deg}
  .r-row .upper{--e:-52deg}
  .r-row .arm{--a:0deg;animation:rA 2.4s}       @keyframes rA{0%,100%{--a:0deg}50%{--a:26deg}}
  .r-row .fore{--b:0deg;animation:rB 2.4s}      @keyframes rB{0%,100%{--b:0deg}50%{--b:-98deg}}
  .r-high .arm{--a:6deg;animation:hA 2.2s}      @keyframes hA{0%,100%{--a:6deg}50%{--a:74deg}}
  .r-high .fore{--b:14deg;animation:hB 2.2s}    @keyframes hB{0%,100%{--b:14deg}50%{--b:56deg}}
  .r-pull .arm{--a:164deg;animation:uA 2.6s}    @keyframes uA{0%,100%{--a:164deg}50%{--a:126deg}}
  .r-pull .fore{--b:0deg;animation:uB 2.6s}     @keyframes uB{0%,100%{--b:0deg}50%{--b:-54deg}}
  .r-pullup .body{animation:uY 2.6s}            @keyframes uY{0%,100%{--y:0px}50%{--y:-15px}}
  .r-sap .upper{--e:-14deg}
  .r-sap .arm{--a:148deg;animation:sA 2.4s}     @keyframes sA{0%,100%{--a:148deg}50%{--a:92deg}}
  .r-sap .fore{--b:6deg}
  .r-curl .arm{--a:6deg}
  .r-curl .fore{--b:0deg;animation:cB 2.2s}     @keyframes cB{0%,100%{--b:0deg}50%{--b:-124deg}}
  .r-tri .arm{--a:166deg}
  .r-tri .fore{--b:-138deg;animation:tB 2.2s}   @keyframes tB{0%,100%{--b:-138deg}50%{--b:-8deg}}
  .r-squat .upper{--e:0deg;animation:qE 2.6s}   @keyframes qE{0%,100%{--e:0deg}50%{--e:-18deg}}
  .r-squat .thigh{--c:0deg;animation:qC 2.6s}   @keyframes qC{0%,100%{--c:0deg}50%{--c:-50deg}}
  .r-squat .shin{--d:0deg;animation:qD 2.6s}    @keyframes qD{0%,100%{--d:0deg}50%{--d:56deg}}
  .r-squat .body{animation:qY 2.6s}             @keyframes qY{0%,100%{--y:0px}50%{--y:9px}}
  .r-squat .arm{--a:4deg}
  .r-split .mir .thigh,.r-split .mir .shin{animation-delay:-1.3s}
  .r-hinge .upper{--e:0deg;animation:gE 2.8s}   @keyframes gE{0%,100%{--e:0deg}50%{--e:-60deg}}

let clk={mode:'stopwatch',running:false,t0:0,elapsed:0,laps:[],cfg:{min:10,sec:0,rounds:10,work:20,rest:10},raf:null,lastBeep:-1,label:'',seq:null};
const MODES={stopwatch:'STOPWATCH',countdown:'COUNTDOWN · AMRAP',emom:'EMOM',tabata:'TABATA',rounds:'FOR TIME · ROUNDS'};
function renderWod(){

    <div class="sel">${Object.keys(MODES).map(m=>`<button data-mode="${m}" class="${clk.mode===m?'on':''}">${MODES[m].split(' ·')[0]}</button>`).join('')}</div>
    <div class="clock"><div class="mode" id="ckMode">${MODES[clk.mode]}${clk.label?' · '+clk.label:''}</div><div class="time" id="ckTime">0:00</div><div class="lap" id="ckLap"></div>
      <div class="cfg" id="ckCfg"></div>
      <div class="ctr"><button class="btn" id="ckStart">START</button><button class="btn ghost" id="ckLapBtn">LAP</button><button class="btn red" id="ckReset">RESET</button></div>
      <div class="laps" id="ckLaps"></div></div>
    <div class="sub h">Presets</div>

      <button class="tbtn" data-preset="snatch">SNATCH TEST 5:00</button><button class="tbtn" data-preset="emom10">EMOM 10 · SWINGS</button>
      <button class="tbtn" data-preset="tabata">TABATA 8 × 20/10</button><button class="tbtn" data-preset="stretch">STRETCH 6 × 60s</button>
      <button class="tbtn" data-preset="legs">LEGS 400 FOR TIME</button><button class="tbtn" data-preset="amrap20">AMRAP 20</button>
    </div>
    <div class="sub h">Logged WODs</div>
    <div id="wodLog">${renderWodLog()}</div>`;
  cfgUI();paintClock();
}
function renderWodLog(){const w=Object.values(db.sessions).filter(s=>s.type==='wod').sort((a,b)=>b.date>a.date?1:-1).slice(0,8);
  return w.length?w.map(s=>`<div class="hrow"><div class="l">${s.name}<small>${s.date}</small></div><div class="r">${s.result}</div></div>`).join(''):`<div class="empty">Stop the clock and tap SAVE to log a WOD time.</div>`;}
function cfgUI(){const c=clk.cfg,m=clk.mode,h=$('ckCfg');if(!h)return;
  const f=(id,l,v)=>`<div><label>${l}</label><input id="${id}" inputmode="numeric" value="${v}"></div>`;
  h.innerHTML=m==='countdown'?f('cMin','MINUTES',c.min)+f('cSec','SECONDS',c.sec):m==='emom'?f('cRounds','ROUNDS (1 MIN EACH)',c.rounds):
    m==='tabata'?f('cRounds','ROUNDS',c.rounds)+f('cWork','WORK (S)',c.work)+f('cRest','REST (S)',c.rest):'';
  h.style.display=h.innerHTML?'':'none';}
function readCfg(){const g=id=>{const e=$(id);return e?+e.value||0:null;};const c=clk.cfg;
  if(g('cMin')!==null)c.min=g('cMin');if(g('cSec')!==null)c.sec=g('cSec');if(g('cRounds')!==null)c.rounds=g('cRounds')||1;if(g('cWork')!==null)c.work=g('cWork')||20;if(g('cRest')!==null)c.rest=g('cRest')||10;}
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function now(){return clk.running?clk.elapsed+(performance.now()-clk.t0)/1000:clk.elapsed;}
function paintClock(){const T=$('ckTime');if(!T)return;const e=now(),c=clk.cfg;let txt='',cls='',lap='';
  if(clk.mode==='stopwatch'||clk.mode==='rounds'){txt=mmss(e);lap=clk.laps.length?'LAP '+clk.laps.length+' · '+mmss(e-clk.laps[clk.laps.length-1]):'';}
  else if(clk.mode==='countdown'){const tot=c.min*60+c.sec,left=tot-e;txt=mmss(left);cls=left<=10?'warn':'';if(left<=0&&clk.running)finish('TIME');
    if(clk.running&&left<=3&&Math.ceil(left)!==clk.lastBeep){clk.lastBeep=Math.ceil(left);beep(1);}}
  else if(clk.mode==='emom'){const r=Math.floor(e/60)+1,left=60-(e%60);txt=mmss(left);cls=left<=5?'warn':'work';lap='ROUND '+Math.min(r,c.rounds)+' / '+c.rounds;
    if(clk.running&&r>c.rounds)finish('EMOM DONE');if(clk.running&&r!==clk.lastBeep){clk.lastBeep=r;if(e>0.5)beep(2);}}
  else if(clk.mode==='tabata'){const per=c.work+c.rest,r=Math.floor(e/per)+1,ph=e%per,isWork=ph<c.work,left=isWork?c.work-ph:per-ph;
    txt=mmss(left);cls=isWork?'work':'restp';lap=(isWork?'WORK':'REST')+' · ROUND '+Math.min(r,c.rounds)+' / '+c.rounds;const key=r*2+(isWork?0:1);
    if(clk.running&&r>c.rounds)finish('TABATA DONE');if(clk.running&&key!==clk.lastBeep){clk.lastBeep=key;if(e>0.5)beep(isWork?2:1);}}
  T.textContent=txt;T.className='time '+cls;$('ckLap').textContent=lap;$('ckStart').textContent=clk.running?'PAUSE':(e>0?'RESUME':'START');
  const sw=clk.mode==='stopwatch'||clk.mode==='rounds';$('ckLapBtn').textContent=sw?(clk.running||e===0?'LAP':'SAVE'):'SAVE';
  $('ckLaps').innerHTML=clk.laps.map((l,i)=>`L${i+1} ${mmss(l)}`).join(' · ');
  if(clk.running)clk.raf=requestAnimationFrame(paintClock);}
function finish(msg){clk.running=false;clk.elapsed=now();beep(3);flash(msg);paintClock();}
let actx=null;function beep(n){try{if(navigator.vibrate)navigator.vibrate(n===3?[80,60,80,60,200]:n===2?[60,40,60]:40);
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
  o.frequency.value=n===3?660:880;g.gain.value=.15;o.start(actx.currentTime+i*.18);o.stop(actx.currentTime+i*.18+.12);}}catch(e){}}
function clkStart(){readCfg();if(clk.running){clk.elapsed=now();clk.running=false;cancelAnimationFrame(clk.raf);paintClock();}
  else{if(actx&&actx.state==='suspended')actx.resume();clk.t0=performance.now();clk.running=true;paintClock();}}
function clkReset(){clk.running=false;cancelAnimationFrame(clk.raf);clk.elapsed=0;clk.laps=[];clk.lastBeep=-1;paintClock();}
function clkLap(){const sw=clk.mode==='stopwatch'||clk.mode==='rounds';
  if(sw&&clk.running){clk.laps.push(now());paintClock();}

async function saveWod(){const e=now();let res=clk.mode==='stopwatch'||clk.mode==='rounds'?mmss(e)+(clk.laps.length?' · '+clk.laps.length+' laps':''):MODES[clk.mode].split(' ·')[0]+' '+mmss(e);
  const name=clk.label||MODES[clk.mode];const key=today()+'#wod'+Date.now();db.sessions[key]={date:today(),type:'wod',name,result:res};
  try{await save();flash('WOD LOGGED');$('wodLog').innerHTML=renderWodLog();}catch(_){flash('SAVE FAILED');}}

    else{draft.kb=draft.kb&&draft.kb.day===kday?draft.kb:{day:kday,reps:{}};draft.kb.reps[i]=Math.max(0,(draft.kb.reps[i]||0)+n);persistDraft();renderKB();}
    if(navigator.vibrate)navigator.vibrate(8);return;}
  const au=T.closest('[data-audit]'); if(au){const i=+au.dataset.audit;draft.audit=draft.audit||{};draft.audit[i]=draft.audit[i]===1?0:draft.audit[i]===0?undefined:1;persistDraft();renderHome();return;}
  if(T.id==='auditSave'){const A=draft.audit||{};if(!Object.keys(A).length){flash('MARK THE TESTS FIRST');return;}
    db.audits[today()]=AUDIT.map((_,i)=>A[i]===undefined?null:A[i]);await save();draft.audit={};flash('AUDIT SAVED');renderHome();return;}
  if(T.id==='auditClock'){preset('audit');return;}
  if(T.id==='stretchGo'){preset('stretch');return;}
  if(T.id==='snGo'){const m=+$('snMin').value||10;db.snatch=Object.assign({},db.snatch,{bell:+$('snBell').value||db.bell,min:m});save().catch(()=>{});preset('snatch');clk.cfg.min=m;clk.label='SNATCH TEST '+db.snatch.bell+'KG';renderWod();return;}
  if(T.id==='snPass'){const s=Object.assign({min:10,log:[]},db.snatch);s.bell=+$('snBell').value||db.bell;s.min=+$('snMin').value||s.min;s.log=(s.log||[]).concat([{date:today(),bell:s.bell,min:s.min}]);
    if(s.min<=5){s.min=10;flash('PASSED AT 5:00 — GO UP A BELL');}else{s.min-=1;flash('CAP NOW '+s.min+':00');}db.snatch=s;await save();renderKB();return;}
  const md=T.closest('[data-mode]'); if(md){clk.mode=md.dataset.mode;clk.label='';clkReset();renderWod();return;}
  const pr=T.closest('[data-preset]'); if(pr){preset(pr.dataset.preset);return;}
  if(T.id==='ckStart'){clkStart();return;} if(T.id==='ckReset'){clkReset();return;} if(T.id==='ckLapBtn'){clkLap();return;}
  const head=T.closest('.chead'); if(head&&head.dataset.head!==undefined){document.querySelector(`[data-card="${head.dataset.head}"]`).classList.toggle('open');return;}
  const tick=T.closest('.tick');
  if(tick){
    const i=+tick.dataset.e,j=+tick.dataset.s,ex=GYM[gday].ex[i];
    draft.gym=draft.gym&&draft.gym.day===gday?draft.gym:{day:gday,sets:{}};const S=draft.gym.sets;S[i]=S[i]||{};const cur=S[i][j]||{};
    const card=document.querySelector(`[data-card="${i}"]`);
    const wI=card.querySelector(`input[data-s="${j}"][data-f="w"]`),rI=card.querySelector(`input[data-s="${j}"][data-f="r"]`);
    const w=+(wI.value||wI.placeholder||0),r=+(rI.value||rI.placeholder||0),on=!cur.done;
    const last=lastFor(ex.n),pr=on&&last&&better({w,r},last);
    S[i][j]={w,r,done:on,pr}; wI.value=w||''; rI.value=r||'';
    tick.className='tick'+(on?(pr?' on pr':' on'):'');tick.textContent=pr?'▲':'✓';
    const done=Object.values(S[i]).filter(x=>x.done).length;
    card.querySelector('.pill').textContent=done+'/'+ex.s;card.classList.toggle('done',done===ex.s);
    if(on){
      const all=bestFor(ex.n);
      if(w>0&&(!all||better({w,r},all)))flash('ALL-TIME BEST · '+ex.n.toUpperCase(),'gold');
      else if(pr)flash('▲ BEAT LAST · '+fmtSet(w,r,unitOf(ex)));
      startRest(/Lateral|Giant|Fly|Pull-Apart|Curl|Face/.test(ex.n)?60:120);
      if(navigator.vibrate)navigator.vibrate(12);
    }
    meters();persistDraft();
    /* refresh the header line without a full re-render */
    const p=card.querySelector('.cname p');if(last){const beaten=Object.values(S[i]).some(x=>x.done&&better({w:+x.w||0,r:+x.r||0},last));
      p.innerHTML=`${ex.s} × ${ex.r} · last <b>${fmtSet(last.w,last.r,unitOf(ex))}</b> · ${beaten?'<span class="beaten">▲ BEATEN</span>':`beat <span class="beat">${last.w>0?last.w+unitOf(ex)+' × '+(last.r+1):(last.r+1)+' reps'}</span>`}`;}
    return;
  }
  if(T.id==='export'){const b=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='deadwick-'+today()+'.json';a.click();return;}
  if(T.id==='wipe'){if(confirm('Wipe ALL history on this device?')){db={sessions:{},bell:16,audits:{}};await save();render();}return;}
});
document.addEventListener('input',e=>{
  const inp=e.target.closest('input[data-e]'); if(!inp) return;
  const i=+inp.dataset.e,j=+inp.dataset.s;
  draft.gym=draft.gym&&draft.gym.day===gday?draft.gym:{day:gday,sets:{}};const S=draft.gym.sets;
  S[i]=S[i]||{};S[i][j]=S[i][j]||{done:false};S[i][j][inp.dataset.f]=inp.value===''?'':+inp.value;
  meters();persistDraft();
});
function startRest(sec){
  clearInterval(restTimer);restLeft=sec;$('rest').classList.add('on');paint();
  restTimer=setInterval(()=>{restLeft--;paint();if(restLeft<=0){clearInterval(restTimer);$('rest').classList.remove('on');if(navigator.vibrate)navigator.vibrate([30,60,30]);}},1000);
  function paint(){$('restT').textContent='REST '+mmss(restLeft);}
}
$('restX').onclick=()=>{clearInterval(restTimer);$('rest').classList.remove('on');};
function flash(m,c){const f=$('flash');f.textContent=m;f.className='flash on'+(c?' '+c:'');clearTimeout(flashT);flashT=setTimeout(()=>f.classList.remove('on'),2400);}
$('save').onclick=async()=>{
  const d=today();
  if(tab==='gym'){const ex={},S=draft.gym&&draft.gym.day===gday?draft.gym.sets:{};
    GYM[gday].ex.forEach((e,i)=>{const sets=Object.values(S[i]||{}).filter(s=>s.done).map(s=>({w:+s.w||0,r:+s.r||0}));if(sets.length)ex[e.n]=sets;});
    if(!Object.keys(ex).length){flash('LOG A SET FIRST');return;}
    db.sessions[d+'#gym-'+gday]={date:d,type:'gym',name:GYM[gday].name,ex};draft.gym=null;}
  if(tab==='home'){const L=draft.legs||{},ex={};LEGS400.forEach((e,i)=>{if(L[i])ex[e.n]=[{w:0,r:L[i]}];});
    if(!Object.keys(ex).length){flash('COUNT SOME REPS FIRST');return;}
    db.sessions[d+'#legs']={date:d,type:'legs',name:'Legs 400 · home',ex};draft.legs=null;}
  if(tab==='kb'){const R=draft.kb&&draft.kb.day===kday?draft.kb.reps:{},ex={};KB[kday].ex.forEach((e,i)=>{if(R[i])ex[e.n]=[{w:db.bell,r:R[i]}];});
    if(!Object.keys(ex).length){flash('COUNT SOME REPS FIRST');return;}
    db.sessions[d+'#kb-'+kday]={date:d,type:'kb',name:'Bell · '+KB[kday].name,bell:db.bell,ex};draft.kb=null;}
  try{await save();persistDraft();flash('SESSION SAVED');render();}catch(err){flash('SAVE FAILED — TRY AGAIN');}
};
load();
</script>
